common_reference_preprocessing:
  encoded_color_space: sRGB numeric RGB; do not linearize gamma
  input_range: float32 [0,1]
  channel_order: RGB
  resize_resolution: exact H,W of frozen F2 reference tensor from target_reference_manifest
  resize_method: bilinear RGB with align_corners=false; nearest binary mask
  transform_position_default: after resize and before frozen F2 normalization
  normalization_position: after every reference transform
  target_rgb_mutable: false
  target_mask_mutable: false
  target_pose_camera_mutable: false
  reference_pose_camera_mutable: false
  basis_teacher_checkpoint_renderer_mutable: false
  output_hash_policy:
    algorithm: sha256
    rgb_bytes: contiguous little-endian float32 C-order after transform
    mask_bytes: contiguous uint8 C-order
    immutable_companions: hash target RGB/mask/pose/camera and reference mask before and after

color_transforms:
  C0:
    transform_name: ORIGINAL_REFERENCE_RGB
    exact_formula: output = input
    parameter_values: {}
    rgb_color_space: sRGB numeric RGB [0,1]
    operation_order: resize -> identity -> F2 normalization
    resize_position: before transform
    dtype: float32
    clipping: none
    rounding: none
    mask_treatment: frozen mask unchanged; RGB unchanged inside and outside
    target_immutability: all target fields bitwise unchanged
    deterministic_seed: null; no random operation
    output_hash_policy: sha256 of float32 RGB and uint8 mask bytes
  C1:
    transform_name: FIXED_LUMINANCE_GRAYSCALE
    exact_formula: Y=0.299*R+0.587*G+0.114*B; output=(Y,Y,Y)
    parameter_values: {red: 0.299, green: 0.587, blue: 0.114}
    rgb_color_space: sRGB numeric RGB [0,1]; no gamma linearization
    operation_order: resize -> grayscale all reference RGB pixels -> F2 normalization
    resize_position: before transform
    dtype: float32 input/output; float64 weighted accumulation
    clipping: clip transformed values to [0,1]
    rounding: none; no quantization
    mask_treatment: RGB transform applies to the whole reference image; binary clothing mask remains bitwise unchanged
    target_immutability: all target fields bitwise unchanged
    deterministic_seed: null; no random operation
    output_hash_policy: sha256 of float32 RGB and uint8 mask bytes
  C2:
    transform_name: DETERMINISTIC_HUE_SHIFT
    exact_formula: RGB->HSV; H_out=(H_in+1/3) mod 1; S,V unchanged; HSV->RGB
    parameter_values: {hue_fraction: 0.3333333333333333, hue_degrees: 120}
    rgb_color_space: sRGB numeric RGB converted to standard HSV with H in [0,1)
    operation_order: resize -> whole-image RGB-to-HSV -> hue wrap -> HSV-to-RGB -> F2 normalization
    resize_position: before transform
    dtype: float32 input/output; float64 color conversion
    clipping: clip output RGB to [0,1]
    rounding: none; no quantization
    mask_treatment: RGB transform applies to the whole reference image; binary clothing mask remains bitwise unchanged
    target_immutability: all target fields bitwise unchanged
    deterministic_seed: null; no random operation
    output_hash_policy: sha256 of float32 RGB and uint8 mask bytes
  C3:
    transform_name: CROSS_OUTFIT_HISTOGRAM_MATCHING
    exact_formula: per channel Qs(q_i),Qd(q_i), then piecewise-linear Qd(Qs^-1(x)); q_i=i/255
    parameter_values:
      quantile_count: 256
      quantile_grid: q_i=i/255 for i=0,...,255 including both endpoints
      quantile_method: linear
      interpolation: piecewise linear
      repeated_source_knot_rule: collapse exact-equal Qs knots and use arithmetic mean of their Qd ordinates
      donor_cycle: {O01: O02, O02: O03, O03: O04, O04: O08, O08: O01}
    rgb_color_space: sRGB numeric RGB [0,1], channels independent
    operation_order: resize -> masked source/donor quantiles -> interpolate -> clip -> half-up quantize -> float32 -> restore exterior -> F2 normalization
    resize_position: before quantiles and mapping
    dtype: float32 input; float64 quantiles/interpolation; float32 output
    clipping: clip interpolation result to [0,1] before rounding
    rounding: round_half_up_8bit=floor(255*x+0.5)/255; Python round forbidden
    mask_treatment: source statistics use source frozen clothing mask; donor statistics use donor frozen clothing mask; only source mask-interior RGB changes; source exterior and both masks unchanged
    target_immutability: target/pose/camera/alpha/basis/checkpoint bitwise unchanged; donor supplies color distribution only
    deterministic_seed: null; donor cycle and quantile grid are fixed
    output_hash_policy: sha256 of float32 RGB and uint8 source/donor mask bytes
  C4:
    transform_name: BRIGHTNESS_CONTRAST_NORMALIZATION
    exact_formula: y=((x-mu_source)/max(std_source,epsilon))*std_target+mu_target per channel; if std_source<epsilon then y=mu_target
    parameter_values:
      epsilon: 1.0e-6
      variance: population variance ddof=0
      target_statistics: pooled mask-interior pixels from every unique (seen outfit, frozen condition) training-reference image, each unique image once
      target_statistics_order: seen_outfit_order then target_condition_order then row-major mask pixels
    rgb_color_space: sRGB numeric RGB [0,1], channels independent
    operation_order: resize -> masked float64 statistics -> affine map/degenerate rule -> clip -> float32 -> restore exterior -> F2 normalization
    resize_position: before source and frozen-global statistics
    dtype: float32 input/output; float64 mean/variance/affine accumulation
    clipping: clip mapped RGB to [0,1]
    rounding: none; no 8-bit quantization
    mask_treatment: only mask-interior RGB changes; exterior RGB and binary mask bitwise unchanged
    target_immutability: all target fields bitwise unchanged
    deterministic_seed: null; corpus and traversal order are fixed
    output_hash_policy: sha256 of target-stat float64 bytes, output float32 RGB, and uint8 mask
  C5:
    transform_name: RGB_GAUSSIAN_BLUR_MASK_RETAINED
    exact_formula: separable convolution with normalized G[k]=exp(-k^2/(2*sigma^2))/sum(G), k=-5,...,5
    parameter_values: {kernel_size: 11, sigma_pixels: 3.0, padding: reflect, channels: independent}
    rgb_color_space: sRGB numeric RGB [0,1]
    operation_order: resize -> separable vertical/horizontal blur -> clip -> restore exterior -> F2 normalization
    resize_position: transform is after resize at frozen F2 input resolution and before normalization
    dtype: float32 input/kernel/convolution/output
    clipping: clip blurred output to [0,1]
    rounding: none; no quantization
    mask_treatment: RGB changes only inside frozen mask; exterior RGB restored; mask bitwise unchanged and never blurred
    target_immutability: do not blur target, target alpha, pose/camera, reference pose/camera, basis, or checkpoint
    deterministic_seed: null; no random operation
    output_hash_policy: sha256 of float32 RGB and uint8 mask bytes
  C6:
    transform_name: MASK_BOUNDARY_AVERAGE_GARMENT_COLOR
    exact_formula: mask-interior output RGB equals per-channel arithmetic mean of that reference's mask-interior RGB
    parameter_values: {mean_accumulation: float64, mean_scope: current reference clothing-mask pixels}
    rgb_color_space: sRGB numeric RGB [0,1], channels independent
    operation_order: resize -> masked mean -> fill interior -> restore exterior -> F2 normalization
    resize_position: before masked mean and fill
    dtype: float32 input/output; float64 mean accumulation
    clipping: clip fill value to [0,1]
    rounding: none; no quantization
    mask_treatment: retain exact binary boundary; exterior RGB and mask bitwise unchanged
    target_immutability: all target fields bitwise unchanged
    deterministic_seed: null; no random operation
    output_hash_policy: sha256 of float32 RGB and uint8 mask bytes

