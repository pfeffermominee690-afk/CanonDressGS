    - {id: AAB_B_POSITION_0, values: [B,A,A], macro: AAB}
    - {id: AAB_B_POSITION_1, values: [A,B,A], macro: AAB}
    - {id: AAB_B_POSITION_2, values: [A,A,B], macro: AAB}
    - {id: ABB_A_POSITION_0, values: [A,B,B], macro: ABB}
    - {id: ABB_A_POSITION_1, values: [B,A,B], macro: ABB}
    - {id: ABB_A_POSITION_2, values: [B,B,A], macro: ABB}
    - {id: BBB, values: [B,B,B], macro: BBB}
  sets_per_pair_view: 8
  query_sets_per_method: 320
  methods: [Ours-v2, B6, B7]
  total_method_queries: 960
