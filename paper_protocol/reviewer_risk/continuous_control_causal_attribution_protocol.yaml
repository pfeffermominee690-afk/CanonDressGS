automatic_metrics:
  render_metrics: [garment_rgb_mae, lpips, silhouette_iou, boundary_fscore, protected_lpips]
  residual_metrics: [displacement_rms, displacement_p95, opacity_activation_rms, opacity_activation_p95, sh0_difference_rms, shN_difference_rms]
  garment_rgb_reference: alpha-matched linear RGB blend of existing FULL endpoints
  protected_lpips_reference: source endpoint RGB
  silhouette_threshold: 0.5
  boundary_tolerance_formula: max(1,floor(0.005*min(H,W)+0.5))
  aggregation: preserve every pair/direction/subset/alpha/view record and preregistered medians
  result_driven_thresholding_forbidden: true

visual_artifact_grading:
  scale: {0: NONE, 1: MINOR, 2: MODERATE, 3: SEVERE}
  categories: [cloud, mottle, edge_scatter, full_body_contamination, identity_contamination, silhouette_discontinuity, patch_artifact]
  fixed_rubric:
    NONE: no visible instance at native sheet scale
    MINOR: localized and faint; garment identity and silhouette remain readily readable
    MODERATE: conspicuous localized or repeated artifact that impairs garment texture or boundary
    SEVERE: broad, dense, full-body, identity-affecting, or silhouette-breaking artifact
  per_item_fields: [actual_opened, source_paths, grades_by_subset_alpha_view, artifact_spatial_location, notes]
  single_total_score_forbidden: true
  alpha_0_50_only_review_forbidden: true

factorial_analysis:
  coding: standard two-level 2^3 factorial contrast over subsets 000 through 111
  effects: [G, V, A, GxV, GxA, VxA, GxVxA]
  continuous_effect_definition: half difference of mean response at positive versus negative contrast level
  continuous_standardization: effect divided by pooled standard deviation across eight subset responses with epsilon 1.0e-8
  visual_reports: [presence_difference, severity_difference, interaction_necessity]
  strong_continuous_evidence:
    standardized_effect_magnitude_min: 0.8
    pair_direction_consistency_min: 6
    direction_consistency_required: true
  strong_visual_evidence:
    artifact_grade_increase_min: 1
    pair_count_min: 6
    consistent_views_min: 3
  metric_selection_after_results_forbidden: true

causal_profiles:
  sufficiency:
    G: '100'
    V: '010'
    A: '001'
  necessity:
    G: ['111', '011']
    V: ['111', '101']
    A: ['111', '110']
  interactions:
    GxV: ['110', '100', '010', '000']
    GxA: ['101', '100', '001', '000']
    VxA: ['011', '010', '001', '000']
    GxVxA: ['111', '110', '101', '011', '100', '010', '001', '000']

classification:
  primary_candidates:
    - GEOMETRY_MAIN_EFFECT
    - VISIBILITY_MAIN_EFFECT
    - APPEARANCE_MAIN_EFFECT
    - GEOMETRY_VISIBILITY_INTERACTION
    - GEOMETRY_APPEARANCE_INTERACTION
    - VISIBILITY_APPEARANCE_INTERACTION
    - THREE_WAY_INTERACTION
    - MULTIPLE_INDEPENDENT_FACTORS
    - CAUSAL_ATTRIBUTION_INCONCLUSIVE
  pair_threshold: 6
  main_effect_rule: sufficient and necessary in at least 6 pairs, direction-consistent, and other factors clearly weaker
  pairwise_interaction_rule: singles insufficient, pair combination reproduces artifact, removal of either factor reduces artifact, in at least 6 pairs
  three_way_interaction_rule: singles and pairs insufficient, FULL distinctly worse, in at least 6 pairs
  multiple_independent_rule: at least two main effects independently sufficient without interaction
  inconclusive_rule: high pair or direction inconsistency, or no preregistered rule satisfied
  secondary_sources_allowed: [GEOMETRY_MAIN_EFFECT, VISIBILITY_MAIN_EFFECT, APPEARANCE_MAIN_EFFECT, GEOMETRY_VISIBILITY_INTERACTION, GEOMETRY_APPEARANCE_INTERACTION, VISIBILITY_APPEARANCE_INTERACTION, THREE_WAY_INTERACTION]

