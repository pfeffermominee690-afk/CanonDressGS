factor_contract:
  channel_order: [delta_xyz, delta_log_scaling, delta_rotvec, delta_opacity_logit, delta_sh0, delta_shN]
  factors:
    G: [delta_xyz, delta_log_scaling, delta_rotvec]
    V: [delta_opacity_logit]
    A: [delta_sh0, delta_shN]
  factor_order: [G, V, A]
  subset_order: ['000', '100', '010', '001', '110', '101', '011', '111']
  subsets:
    '000': []
    '100': [G]
    '010': [V]
    '001': [A]
    '110': [G, V]
    '101': [G, A]
    '011': [V, A]
    '111': [G, V, A]
  new_render_subsets: ['100', '010', '001', '110', '101', '011']
  source_endpoint_subset: '000'
  full_subset: '111'
  forward_rule: R_source + alpha * P_subset(R_target - R_source)
  unselected_channel_rule: bitwise_equal_to_source_endpoint
  interpolation_space: frozen post-protected-guard GaussianClothingResiduals
  gaussian_index_order: frozen base checkpoint _xyz row order
  new_render_count: 1440
  endpoint_reuse_count: 80
  full_reuse_count: 240
  full_reverse_mapping: B_TO_A(alpha) maps to stored A_TO_B(1-alpha)
  full_regeneration_forbidden: true
  endpoint_regeneration_forbidden: true
  missing_only_resume: true
  completed_render_repetition_forbidden: true

implementation_parity:
