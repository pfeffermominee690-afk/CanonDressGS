frozen_reference:
  template_mode: SUBJECT_SPECIFIC_SMPLX_BODY_SURFACE_FALLBACK
  vertex_count: 10475
  face_count: 20908
  joint_count: 55
  vertex_identity_required: 10475
  lbs_source: neutral SMPL-X model.lbs_weights
  lbs_shape: [10475, 55]
