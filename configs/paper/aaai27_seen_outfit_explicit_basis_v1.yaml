data:
  seen_outfits: [O01, O02, O03, O04, O08]
  held_out_diagnostic: O07
  unused_reserve: O06
  target_views: [cond_000000, cond_000318, cond_000017, cond_000347]
  view_names: {cond_000000: front, cond_000318: back, cond_000017: left, cond_000347: right}
  references_per_episode: 3
  episode_count: 20
  reference_target_overlap: 0

pipeline:
  - multi_reference_rgb
  - reference_clothing_mask
  - frozen_image_backbone_spatial_feature
  - clothing_mask_weighted_mean
  - clothing_mask_masked_max
  - deterministic_reference_set_mean_max
  - layer_norm
  - linear_rank4_coefficient_predictor
  - coefficient_denormalization
  - frozen_explicit_canonical_gaussian_residual_basis
  - canonical_residual_composition
  - frozen_mmlp_human_deformation
  - gaussian_renderer

basis:
  rank: 4
  method: deterministic_centered_svd
  frozen: true
  channel_bounds: {xyz: 0.05, log_scaling: 0.35, rotation: 0.2617993878, opacity_logit: 2.0, sh0: 0.25, shN: 0.10}

predictor:
  input: frozen_f2_clothing_mean_masked_max_reference_set_mean_max
  architecture: LayerNorm+Linear(4)
  trainable_parameters: 3076
  output: standardized_raw_coefficients
  activation: none
  denormalization: coefficient_std_times_train_std_plus_train_mean

training:
  seeds: [0, 1, 2]
  optimizer: Adam
  steps: 300
  learning_rate: 0.02
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  balanced_batch_order: [O01, O02, O03, O04, O08]
  target_view_schedule: round_robin
  early_stop: false
  exact_resume_required: true
  data_order_identical_across_seeds: true
  loss:
    coefficient: SmoothL1
    pairwise_geometry_weight: 0.10

metrics:
  coefficient: [standardized_coefficient_rmse, restored_coefficient_rmse, nearest_teacher_accuracy, correct_outfit_rank, pairwise_coefficient_margin]
  residual: [normalized_residual_rmse, cosine_similarity, top_10_support_overlap, top_20_support_overlap]
  render: [garment_rgb_mae, garment_alpha_mae, edit_reduction, target_closer_fraction, protected_rgb_mae, background_rgb_mae]
  reference: [correct_vs_swapped_wins, permutation_max_difference, single_reference_accuracy, two_reference_dropout_accuracy, zero_replacement_sensitivity, base_replacement_sensitivity]
  efficiency: [trainable_parameter_count, basis_storage_bytes, peak_vram_bytes, training_time_seconds, inference_time_seconds, render_time_seconds]
  aggregation: [episode, outfit_macro, seed_mean_std]
  pixel_weighted_outfit_micro_average: false

baselines:
  B0: {name: Base Avatar, residual_prediction: none}
  B1: {name: Direct-Optimization Teacher, role: optimization_upper_bound, inference_method: false}
  B2: {name: Outfit-ID Coefficient Lookup, role: seen_memorization_upper_bound, seen_only: true, allowed_in_held_out: false}
  B3: {name: Global Reference Feature, clothing_mask_pooling: false}
  B4: {name: Clothing Mean Only, masked_max: false}
  B5: {name: Legacy Complex Fusion, contract: RF-F, unified_paper_rerun_required: true}
  Ours: {name: Seen-Outfit Explicit Basis V1, config_name: seen_outfit_explicit_basis_v1}

ablations:
  A1: {name: Basis rank, values: [1, 2, 3, 4], predictor_retrained_per_rank: true}
  A2: {name: No clothing mask, feature: global_average}
  A3: {name: Mean only, masked_max: false}
  A4: {name: No coefficient standardization, target: raw_svd_coefficient, tanh: false}
  A5: {name: Legacy endpoint supervision, losses: [tanh_coefficient, SmoothL1, sign_loss, absolute_pair_loss]}
  A6: {name: No pairwise coefficient geometry, pairwise_geometry_weight: 0.0}
  A7: {name: Reference count, Kref: [1, 2, 3]}
  A8: {name: Explicit basis vs historical residual decoder, historical_diagnostic_only: true, methods: [legacy_decoder, V7, Gaussian_token_P1, explicit_basis]}

tables:
  table_1: {name: Seen-outfit main comparison}
  table_2: {name: Method ablation}
  table_3: {name: Efficiency}
  table_4: {name: Held-out diagnostic, status_label: "Held-out diagnostic — FAIL"}

figures:
  figure_1: {name: Method overview, fixed_views: true}
  figure_2: {name: Five-outfit qualitative comparison, fixed_views: true}
  figure_3: {name: Reference swap control, fixed_views: true}
  figure_4: {name: Basis rank ladder, fixed_views: true}
  figure_5: {name: Supervision collapse analysis, fixed_views: true}
  figure_6: {name: Held-out limitation, fixed_views: true}

visual_export:
  allowed_operations: [concatenate, aspect_preserving_crop, label, uniform_crop]
  forbidden_operations: [retouch, artifact_removal, color_change, successful_region_selection]
  cherry_pick_views: false

