schema_version: canondressgs.module4b.canonical_capacity.v1
status: PREREGISTERED_MICRO_PILOT
seed: 20260717
outfits: [O00, O01, O05]
conditions:
  - {condition_id: cond_000000, view: front}
  - {condition_id: cond_000318, view: back}
  - {condition_id: cond_000017, view: left}
  - {condition_id: cond_000347, view: right}
steps: 480
round_robin: [cond_000000, cond_000318, cond_000017, cond_000347]
log_steps: [0, 1, 10, 20, 40, 80, 120, 160, 240, 320, 400, 480]
render_steps: [0, 40, 80, 160, 240, 320, 400, 480]
visual_summary_steps: [0, 80, 160, 320, 480]

# Module 4A is authoritative when its formal trainable-stage contract conflicts
# with the G/A/J shorthand proposed for this pilot.
schedule_policy: module4a_formal_stage_precedence
schedule:
  - {stage: 1, name: appearance_initialization, first_step: 1, last_step: 80}
  - {stage: 2, name: geometry_and_appearance, first_step: 81, last_step: 160}
  - {stage: 3, name: joint_refinement, first_step: 161, last_step: 480}

oracle:
  initial_gate_probability: 0.05
  enable_shn: false
  bounds:
    xyz: 0.05
    log_scaling: 0.35
    rotation: 0.2617993878
    opacity_logit: 2.0
    sh0: 0.25
    shN: 0.10
  optimizer:
    class: Adam
    geometry_residuals_lr: 0.001
    appearance_residuals_lr: 0.002
    geometry_gate_lr: 0.001
    appearance_gate_lr: 0.001
    gradient_clip_norm: 1.0

loss:
  contract: v5_3_region_aware_dual_target
  edit: 1.0
  clothing: 1.0
  preserve: 1.0
  protected: 1.0
  rgb_transition: 0.25
  alpha_global: 0.5
  alpha_edit: 1.0
  alpha_transition_original: 0.25
  alpha_base: 1.0
  transition_smooth_l1_beta: 1.0
  transition_distance_sampling: [1.0, 1.0]
  transition_distance_epsilon: 0.000001
  transition_gradient_cap_fraction: 0.5
  transition_gradient_cap_epsilon: 1.0e-12
  regularization:
    xyz_magnitude: 0.001
    scaling_magnitude: 0.001
    rotation_magnitude: 0.001
    opacity_magnitude: 0.0001
    sh0_magnitude: 0.0001
    shN_magnitude: 0.0001
    geometry_gate_sparsity: 0.0001
    appearance_gate_sparsity: 0.0001
    gate_binary: 0.00001
    graph_gate_smoothness: 0.0001
    graph_residual_smoothness: 0.0001

acceptance:
  first_window: [0, 19]
  last_window: [441, 480]
  slope_window: [401, 480]
  strong_reduction: 0.10
  partial_reduction: 0.02
  protected_max: 0.005
  protected_and_preserve_relative_max: 1.10
  capacity_retention_min: 0.75
  gate_active_threshold: 0.5
  residual_bound_hit_fraction: 0.99
  alpha_threshold: 0.5
  visual_grade_order: [FAIL, WARN, PASS]

constraints:
  one_shared_canonical_field_per_outfit: true
  condition_specific_residuals: false
  image_conditioning_used: false
  teacher_used: false
  target_fields_are_loss_only: true
  frozen_base: true
  frozen_image_backbone: true
  formal_anchor_interpolation: true
  formal_quaternion_composition: true
  no_full_training: true
