schema_version: canondressgs.aaai27.data_capacity_gate.v1
task_id: SUBJECT02-AAAI27-DATA-CAPACITY-GATE-001
status: PREREGISTERED
long_term_branch: pipeline/full-dressable-20260715
long_term_head: 9fc88033b407136073f7bddc6ffca6dd4dd1e0f5
sprint_branch: sprint/aaai27-20260718
input_sprint_head: fece64eed3b80043cd7703364f668a3ef5f9d65f

candidate_outfits: [O01, O02, O03, O04, O06, O07, O08]
conditions:
  - {condition_id: cond_000000, view: front}
  - {condition_id: cond_000318, view: back}
  - {condition_id: cond_000017, view: left}
  - {condition_id: cond_000347, view: right}

generation:
  route: V4_raw_direct_edit
  model: gpt-image-2
  endpoint: images_edits
  output_size: [1024, 1536]
  primary_call_max: 28
  retry_call_max: 4
  total_call_max: 32
  first_valid_response_is_immutable: true
  candidate_sampling_forbidden: true
  protected_only_diagnostic_warn_is_nonblocking: true
  hard_failures:
    - pose_changed
    - view_changed
    - wrong_body_count
    - severe_crop
    - wrong_outfit
    - large_edit_region_distortion
    - limb_structure_failure
    - second_person
    - major_body_proportion_change

segmentation:
  model: mattmdjaga/segformer_b2_clothes
  revision: 584abc1e1d260e23c0fc627c5217a09b2b461046
  local_files_only: true
  garment_core_probability_min: 0.35
  safe_clothing_formula: raw AND foreground AND NOT protected
  forbidden_backends: [SAM2, SCHP]

fixture:
  fixture_id: AAAI_GATE_28
  supervision_mode: dual_target_region_aware_v1
  expected_sample_count: 28
  inference_forbidden_fields: 0

support_compatibility:
  revealed_skin_ratio_low_max: 0.01
  new_silhouette_definition: "|A_edit AND NOT A_base| / |A_edit|"
  support_shift_normalization: base_foreground_bbox_diagonal
  categories: [LOW_SUPPORT_RISK, MEDIUM_SUPPORT_RISK, HIGH_SUPPORT_RISK]

oracle:
  kind: gaussian_level_fixed_open_canonical
  seed: 20260718
  steps: 480
  round_robin: [cond_000000, cond_000318, cond_000017, cond_000347]
  updates_per_condition: 120
  log_steps: [0, 1, 10, 20, 40, 80, 120, 160, 240, 320, 400, 480]
  render_steps: [0, 40, 80, 160, 240, 320, 400, 480]
  schedule:
    - {stage: 1, name: geometry_scale_rotation_opacity, first_step: 1, last_step: 80}
    - {stage: 2, name: sh0_opacity, first_step: 81, last_step: 160}
    - {stage: 3, name: all_degree0_channels, first_step: 161, last_step: 480}
  fixed_gates: {geometry: 1.0, appearance: 1.0, opacity: 1.0}
  train_gate: false
  shared_canonical_field: true
  condition_specific_residuals: false
  enable_shn: false
  optimized_attributes: [delta_xyz, delta_log_scaling, delta_rotvec, delta_opacity_logit, delta_sh0]
  bounds:
    xyz: 0.05
    log_scaling: 0.35
    rotation: 0.2617993878
    opacity_logit: 2.0
    sh0: 0.25
    shN: 0.10
  optimizer:
    class: Adam
    geometry_residuals_lr: 0.001
    appearance_residuals_lr: 0.002
    gradient_clip_norm: 1.0
  loss_contract: v5_3_region_aware_dual_target
  forbidden_modules: [anchor_oracle, image_encoder, aggregator, completer, HyperNetwork, garment_layer]

numeric_acceptance:
  first_window: [0, 19]
  last_window: [441, 480]
  slope_window: [401, 480]
  pass_reduction_min: 0.05
  warn_reduction_min: 0.02
  pass_requires_both_slopes_nonpositive: true
  protected_final_max: 0.005
  protected_and_preserve_relative_max: 1.10
  finite_required: true

outfit_gate:
  pass_requires:
    - generation_data_gate_pass
    - checker_pass
    - support_risk_low_or_medium
    - numeric_pass
    - visual_pass_or_warn
    - no_missing_body_support
    - no_identity_contamination
  fail_is_not_reserve: true

benchmark_selection:
  primary_train: [O01, O02, O04, O06]
  primary_unseen_test: [O03, O08]
  primary_reserve: [O07]
  minimum_outfits_for_go: 5
  five_outfit_fallback_requires_train_pass_count: 4
  five_outfit_fallback_requires_unseen_pass_count: 1
  replace_failed_unseen_with_o07_only_if_o07_pass: true
  promote_passed_unseen_to_failed_train_slot_in_order: [O03, O08]
  ranking_by_oracle_improvement_forbidden: true
  failed_outfit_cannot_enter_benchmark: true
